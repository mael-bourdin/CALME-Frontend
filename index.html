<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>C.A.L.M.E.</title>
    <meta
      name="description"
      content="Cabine d'analyse et de limitation du métabolisme des explorateurs — programme Horizon 2080."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#d9e3f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)" />

    <!--
      Le thème est posé avant le premier rendu. Sans ça l'écran flashe en clair
      pendant une frame avant de basculer en sombre, ce qui est exactement ce
      qu'il ne faut pas faire à quelqu'un qui entre dans une cabine en pénombre.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('calme.theme');
          const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
